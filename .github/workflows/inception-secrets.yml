name: Reusable - Inception Secret Scan

on:
  workflow_call:
    inputs:
      SHIELD_URL:
        required: false
        type: string
        default: "https://inception-shield.blocksdevelopers.com"
      SERVICE:
        description: "blocks-<service> short name, used for the report filename"
        required: false
        type: string
        default: "utilities"
      FAIL_ON_VERIFIED:
        description: "Fail the job when TruffleHog verifies a live credential"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  secrets:
    name: TruffleHog -> Shield
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Whole history - a secret that was committed and later removed still
          # needs rotating.
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          trufflehog --version

      - name: Scan git history
        run: |
          set -euo pipefail
          # TruffleHog exits non-zero when it finds things; we want the report
          # either way and decide about failing further down.
          trufflehog git "file://$PWD" --json --no-update > raw.json 2>/dev/null || true
          echo "findings: $(grep -c '^{' raw.json || echo 0)"

      - name: Transform to Shield format
        run: python3 scripts/th-transform.py "${{ inputs.SERVICE }}" < raw.json > shield.json

      - name: Publish to Shield portal
        env:
          SHIELD_USER: ${{ secrets.INCEPTION_SHIELD_USER }}
          SHIELD_PASS: ${{ secrets.INCEPTION_SHIELD_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${SHIELD_USER:-}" ] || [ -z "${SHIELD_PASS:-}" ]; then
            echo "::error::secrets SHIELD_USER / SHIELD_PASS are not set"
            exit 1
          fi
          code=$(curl -sS -o /tmp/shield.out -w '%{http_code}' \
            --user "$SHIELD_USER:$SHIELD_PASS" \
            -T shield.json \
            "${{ inputs.SHIELD_URL }}/data/blocks-${{ inputs.SERVICE }}.trufflehog.json")
          echo "HTTP $code"
          case "$code" in
            2*) echo "published: ${{ inputs.SHIELD_URL }}" ;;
            *)  echo "::error::Shield upload failed (HTTP $code)"; head -c 500 /tmp/shield.out; exit 1 ;;
          esac

      - name: Fail on verified secrets
        if: ${{ inputs.FAIL_ON_VERIFIED }}
        run: |
          set -euo pipefail
          verified=$(python3 scripts/th-transform.py --count-verified < raw.json)
          echo "verified live credentials: $verified"
          if [ "$verified" -gt 0 ]; then
            # The finding details stay in the portal - never echoed into the log.
            echo "::error::$verified verified secret(s) found - see ${{ inputs.SHIELD_URL }}"
            exit 1
          fi

      - name: Shred scan output
        if: always()
        run: rm -f raw.json shield.json
