name: CI - Dev

on:
  push:
    branches: [dev]

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: DOCKERFILE_CLIENT
          - component: worker
            dockerfile: DOCKERFILE_WORKER
    name: build-and-push (${{ matrix.component }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # vars.env supplies REPO_NAME, DOCKERFILE_CLIENT, DOCKERFILE_WORKER.
      # The trailing `echo` is required: the vars.env files do not end with a
      # newline, so a bare `cat >>` would splice the last variable onto
      # whatever GitHub appends to $GITHUB_ENV next.
      - name: Load repo variables (vars.env)
        run: |
          set -euo pipefail
          test -f .github/variables/vars.env
          { cat .github/variables/vars.env; echo; } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push ${{ matrix.component }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env[matrix.dockerfile] }}
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_CR }}/${{ env.ENVIRONMENT }}-${{ env.REPO_NAME }}-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ env.ENVIRONMENT }}-${{ env.REPO_NAME }}-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ env.ENVIRONMENT }}-${{ env.REPO_NAME }}-${{ matrix.component }}

      - name: Summary
        run: |
          echo "Pushed \`${{ secrets.DOCKERHUB_CR }}/${{ env.ENVIRONMENT }}-${{ env.REPO_NAME }}-${{ matrix.component }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, cloud-devstg-runner]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load repo variables (vars.env)
        run: |
          set -euo pipefail
          test -f .github/variables/vars.env
          { cat .github/variables/vars.env; echo; } >> "$GITHUB_ENV"

      # The images are private, so the runner needs registry auth. Logging in
      # here keeps the job self-contained instead of relying on whatever
      # credentials happen to sit in the runner user's ~/.docker/config.json.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Update service containers on the VM
        env:
          INFRA_DIR: ${{ vars.BLOCKS_INFRA_DIR }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          INFRA_DIR="${INFRA_DIR:-/root/blocks-infra}"
          SVC="${REPO_NAME#blocks-}"
          TAG_VAR="$(echo "${SVC}_TAG" | tr '[:lower:]' '[:upper:]' | tr '-' '_')"

          # Fail fast with a clear message rather than a confusing compose error.
          test -d "$INFRA_DIR"      || { echo "::error::INFRA_DIR not found: $INFRA_DIR"; exit 1; }
          test -f "$INFRA_DIR/.env" || { echo "::error::missing $INFRA_DIR/.env"; exit 1; }
          test -f "$INFRA_DIR/docker-compose.yml" || { echo "::error::missing $INFRA_DIR/docker-compose.yml"; exit 1; }

          cd "$INFRA_DIR"

          # Persist the tag in .env instead of only exporting it for this shell.
          # Otherwise .env keeps pointing at the previous tag, and any later
          # `docker compose up -d` or `./run.sh -all` silently rolls this
          # service back to the old image.
          cp .env ".env.bak-deploy"
          if grep -qE "^${TAG_VAR}=" .env; then
            sed -i -E "s|^${TAG_VAR}=.*|${TAG_VAR}=${IMAGE_TAG}|" .env
          else
            printf '%s=%s\n' "$TAG_VAR" "$IMAGE_TAG" >> .env
          fi
          echo "Deploying $SVC ($TAG_VAR=$IMAGE_TAG) from $INFRA_DIR"

          # Confirm .env now resolves to the tag we are about to deploy.
          resolved=$(docker compose --env-file .env --profile infra --profile "$SVC" config 2>/dev/null \
                     | grep -oE "image: [^ ]*${SVC}-api:[^ ]*" | head -1)
          echo "compose resolves: $resolved"
          case "$resolved" in
            *":$IMAGE_TAG") ;;
            *) echo "::error::.env did not take the new tag ($TAG_VAR=$IMAGE_TAG); got $resolved"; exit 1 ;;
          esac

          # --profile infra is required for a valid compose project: the app
          # services declare depends_on mongodb, which lives in that profile.
          # It does NOT start infra here because --no-deps is set and only the
          # two service containers are named. mongodb-seed is in its own opt-in
          # [seed] profile, so this can never re-seed and wipe the database.
          docker compose --env-file .env --profile infra --profile "$SVC" \
            pull "${SVC}-api" "${SVC}-worker"
          docker compose --env-file .env --profile infra --profile "$SVC" \
            up -d --no-deps --force-recreate "${SVC}-api" "${SVC}-worker"

          docker image prune -f >/dev/null 2>&1 || true
          echo "Deployed \`$SVC\` -> \`$IMAGE_TAG\` on $(hostname)" >> "$GITHUB_STEP_SUMMARY"

      # Without this the job goes green even when a container crash-loops on
      # startup, which is the most likely way a bad deploy shows up.
      - name: Verify containers are healthy
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          SVC="${REPO_NAME#blocks-}"
          sleep 15
          rc=0
          for c in "${SVC}-api" "${SVC}-worker"; do
            state=$(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo missing)
            restarts=$(docker inspect -f '{{.RestartCount}}' "$c" 2>/dev/null || echo '?')
            running_tag=$(docker inspect -f '{{.Config.Image}}' "$c" 2>/dev/null || echo '?')
            echo "$c: state=$state restarts=$restarts image=$running_tag"
            if [ "$state" != "running" ]; then
              echo "::error::$c is '$state', expected 'running'"
              docker logs --tail 40 "$c" 2>&1 || true
              rc=1
            fi
            case "$running_tag" in
              *":$IMAGE_TAG") ;;
              *) echo "::error::$c is not running the expected tag $IMAGE_TAG"; rc=1 ;;
            esac
          done
          echo "| container | state | restarts |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for c in "${SVC}-api" "${SVC}-worker"; do
            echo "| \`$c\` | $(docker inspect -f '{{.State.Status}}' "$c" 2>/dev/null || echo missing) | $(docker inspect -f '{{.RestartCount}}' "$c" 2>/dev/null || echo '?') |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $rc
