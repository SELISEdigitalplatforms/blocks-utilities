name: Subscription scheduling integration

on:
  pull_request:
    paths:
      - "server/Subscription.DomainService/Scheduling/**"
      - "server/Subscription.DomainService/Services/SubscriptionRenewalService.cs"
      - "server/XUnitTest/Integration/**"
      - ".github/workflows/subscription-scheduling-integration.yml"
  push:
    branches: [dev]
    paths:
      - "server/Subscription.DomainService/Scheduling/**"
      - "server/Subscription.DomainService/Services/SubscriptionRenewalService.cs"
      - "server/XUnitTest/Integration/**"

jobs:
  mongo-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BLOCKS_IT_MONGO: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore server/XUnitTest/XUnitTest.csproj
      # SubscriptionRepositoryIntegrationTests is named here because its guarantees are enforced by
      # MongoDB and not by our code: a unique index, an atomic upsert, a compare-and-set. They can
      # only be demonstrated against a real collection, and a filter that leaves the class out means
      # they are demonstrated nowhere — the suite passes, and nothing has been tried.
      #
      # CampaignRedemptionConcurrencyTests is named for the same reason and was added with the
      # class: one-use campaign reservation is a unique index and a compare-and-set, so "two
      # subscriptions race and exactly one wins" is a claim about MongoDB rather than about our
      # code. Left out, the suite reported 48 passing tests on the pull request that introduced it
      # and had tried none of them.
      #
      # PlanArchiveIntegrationTests is named for the same reason: archiving is a status check and a
      # version check in one conditional write, so "two writers race and exactly one wins" and
      # "an archived organization plan does not hide the active tenant plan" are claims about
      # MongoDB rather than about our code.
      #
      # SubscriptionCatalogueRepositoryIntegrationTests joins it here having run nowhere since it
      # was written. It exists because TryUpdatePlanAsync builds its update from an explicit field
      # list, so a field the service sets and the repository forgets is silently never persisted —
      # which is exactly the kind of thing a filter that omits the class cannot report.
      #
      # PendingPlanChangeIntegrationTests is named for the same reason and was added with the
      # class. Scheduling a plan change is a compound filter ("never over a pending quantity
      # change") and a compare-and-set, and applying one is a transition carrying five new fields
      # that the repository builds from an explicit list — so "two callers race and exactly one
      # wins" and "the price actually reaches the document" are claims about MongoDB, not about
      # our code. Left out of this filter they would be demonstrated nowhere, and a renewal that
      # silently dropped the target price would bill the new plan at the old rate.
      #
      # OpeningStubUpgradeRecoveryIntegrationTests is named because an opening-stub upgrade settles
      # a prepaid year the subscriber has already paid for, and the replacement year travels as a
      # nested document inside a settlement reservation before being installed by an update
      # definition that names one field. Both are claims about MongoDB rather than about our code:
      # a reservation that round-trips without its replacement year promotes an upgrade that
      # silently keeps the old annual figures, and the money has already moved by the time anyone
      # could notice. Left out of this filter that would be demonstrated nowhere.
      #
      # FractionalUsageQuantityIntegrationTests is named because the claim that fractional
      # quantities need no data migration is a claim about a MongoDB write and nothing else: an
      # $inc carrying a Decimal128 onto a field that currently holds a NumberLong has to promote
      # that field in place. Every counter and ledger row already written holds NumberLong, so if
      # that were false the append-only usage ledger would have to be rewritten — and that ledger
      # is the authority every past invoice was computed from. A mocked repository demonstrates
      # none of it.
      #
      # Several integration classes are still outside this filter and so run nowhere. Widening it
      # further belongs in its own change, since whatever it turns up would arrive as unrelated
      # failures on whichever pull request happened to widen it.
      - name: Run subscription Mongo integration suite
        run: >-
          dotnet test server/XUnitTest/XUnitTest.csproj
          --no-restore
          --filter "FullyQualifiedName~SubscriptionWorkQueueIntegrationTests|FullyQualifiedName~SubscriptionRenewalCrashRecoveryIntegrationTests|FullyQualifiedName~SubscriptionRepositoryIntegrationTests|FullyQualifiedName~SubscriptionQueueDocumentFlowIntegrationTests|FullyQualifiedName~CampaignRedemptionConcurrencyTests|FullyQualifiedName~PlanArchiveIntegrationTests|FullyQualifiedName~SubscriptionCatalogueRepositoryIntegrationTests|FullyQualifiedName~PendingPlanChangeIntegrationTests|FullyQualifiedName~OpeningStubUpgradeRecoveryIntegrationTests|FullyQualifiedName~SubscriptionUsageCurrentIntegrationTests|FullyQualifiedName~FractionalUsageQuantityIntegrationTests"
          --verbosity minimal
